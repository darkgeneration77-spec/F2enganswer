<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet"><title>Form 2 English VS — Cambridge Textbook Unit 3</title><style>*{box-sizing:border-box;-webkit-user-select:none;user-select:none}body{margin:0;background:#f5f8fc;font-family:Arial,'Microsoft YaHei',sans-serif;color:#17202a;line-height:1.65}.w{max-width:1100px;margin:auto}.hero{background:#17324d;color:#fff;padding:34px 20px}h1{margin:0}.nav{position:sticky;top:0;background:#fff;border-bottom:1px solid #dbe3ec;z-index:9;padding:9px}.nav a{display:inline-block;padding:6px 10px;margin:3px;background:#eef4ff;border-radius:8px;color:#17324d;text-decoration:none;font-weight:700}main{padding:16px}.s,.q{background:#fff;border:1px solid #dbe3ec;border-radius:14px;padding:17px;margin:15px 0}.s h2{color:#17324d;border-bottom:2px solid #e7edf5;padding-bottom:7px}.inst{font-weight:700;color:#285b8f}.a,.k,.y,.n{padding:8px 10px;margin-top:7px;border-radius:8px}.a{background:#ecfdf3;border-left:5px solid #22c55e}.k{background:#eff6ff;border-left:5px solid #3b82f6}.y{background:#f8fafc;border:1px solid #e5e7eb}.n{background:#fff7ed;border-left:5px solid #f59e0b}.cn{color:#475467}.sample{white-space:pre-wrap;background:#f8fafc;border:1px solid #dbe3ec;padding:13px;border-radius:9px}@media print{.nav{display:none}body{background:#fff}}</style></head><body oncontextmenu="return false"><div class="hero"><div class="w"><h1>Form 2 English VS — Cambridge Textbook Unit 3</h1><div>Teacher’s Reference Version ｜ 老师参考版</div></div></div><div class="nav"><div class="w" id="nav"></div></div><main class="w"><div class="n">原题与答案依据上传的 Cambridge Textbook 与 Answer 文件；主观题保留答案文件提供的 sample / Accept any suitable answers。</div><div id="app"></div></main><script>const S=[];const Q=(p,a,k,e,c)=>({p,a,k,e,c});S.push(['A','Complete the sentences with for or since.',[Q('Some players have worn the same t-shirt ( ) many weeks.','for','many weeks = duration','Use for with a period of time.','many weeks 是时间段，所以用 for。'),Q('They have lived in this village ( ) 1968.','since','1968 = starting point','Use since with a starting point.','1968 是开始时间点，所以用 since。'),Q("I've been in the club ( ) 2010.",'since','2010 = starting point','Use since with a starting year.','2010 是开始年份，所以用 since。'),Q('We have known each other ( ) eight years.','for','eight years = duration','Use for with a length of time.','eight years 是时间段，所以用 for。'),Q("He's been a doctor ( ) nineteen years.",'for','nineteen years = duration','Use for with a period of time.','nineteen years 是时间段，所以用 for。'),Q("I've been working here ( ) 2014.",'since','2014 = starting point','Use since with a starting year.','2014 是开始年份，所以用 since。')]]);S.push(['B','Choose the correct answer.',[Q('What (1) _______ happened?',"'s",'What has happened?',"'s = has in the present perfect.","这里 's = has。"),Q("I've (2) _______ my exams with flying colours.",'passed','have + V3','Present perfect uses have + past participle.','现在完成时用 have + V3。'),Q("I've (3) _______ getting low marks...",'been','have been getting','The form is have been + V-ing.','结构是 have been + V-ing。'),Q('...getting low marks (4) _______ the school exams.','for','official answer: for','The supplied answer is for.','答案文件指定 for。'),Q('How long (5) _______ been at this level?','have you','question order','Use have + subject in the question.','问句使用 have + 主语。'),Q('Only (6) ______ March.','since','March = starting point','Use since with a starting point.','March 是开始时间点。'),Q('I (7) ______ better since last year.',"'ve got",'official answer','The supplied answer is ’ve got.','答案文件指定 ’ve got。')]]);S.push(['C','Match the synonym for the following words.',[Q('victory','success','victory ↔ success','Official synonym pair.','跟答案文件。'),Q('champion','winner','champion ↔ winner','Official synonym pair.','跟答案文件。'),Q('competition','rivalry','competition ↔ rivalry','Official synonym pair.','跟答案文件。'),Q('match','game','match ↔ game','Official synonym pair.','跟答案文件。'),Q('trophy','medal','trophy ↔ medal','Official synonym pair.','跟答案文件。'),Q('squad','team','squad ↔ team','Official synonym pair.','跟答案文件。'),Q('player','contestant','player ↔ contestant','Official synonym pair.','跟答案文件。'),Q('wealth','prosperity','wealth ↔ prosperity','Official synonym pair.','跟答案文件。')],'Word bank: prosperity · medal · team · winner · contestant · success · rivalry · game']);S.push(['D','Forming questions with “How long…” and the present perfect.',[Q('Shanon/a Science teacher?','How long has Shanon been a Science teacher?','How long + present perfect','Official answer.','按原题使用现在完成时。'),Q('Nicole David/play squash?','How long has Nicole David been playing squash?','How long + present perfect','Official answer.','按答案文件。'),Q('you/known her?','How long have you known her?','How long + present perfect','Official answer.','按答案文件。'),Q('she/live in New York?','How long has she lived in New York?','How long + present perfect','Official answer.','按答案文件。'),Q('you/work for them?','How long have you been working for them?','How long + present perfect','Official answer.','按答案文件。'),Q('your/computer broke?','How long has your computer been broken?','How long + present perfect','Official answer.','按答案文件。')]]);S.push(['E','Write sentences using the verbs given and “to”.',[Q('Practise','If you want to win the competition, you need to practise more.','official sample','Sample sentence from answer file.','答案文件示范句。'),Q('Sing','Grandpa asked us to sing a song for his birthday to liven up the celebration.','official sample','Sample sentence from answer file.','答案文件示范句。'),Q('Rain','Please stay home as it is going to rain.','official sample','Sample sentence from answer file.','答案文件示范句。'),Q('Wait','They asked us to wait at the hospital lobby.','official sample','Sample sentence from answer file.','答案文件示范句。'),Q('Sweep','Mom reminded us to sweep the floor before she returns home..','official sample','Sample sentence from answer file.','答案文件示范句。'),Q('Cut','Grandma told us to cut our nails before 7pm.','official sample','Sample sentence from answer file.','答案文件示范句。')],'Example: Break – Be careful not to break the glass as it is a gift from my friend.']);S.push(['F','Complete the text with suitable answers.',[Q('Blank (1)','Malaysian','word bank','Official answer.','答案文件指定。'),Q('Blank (2)','bad','word bank','Official answer.','答案文件指定。'),Q('Blank (3)','auspicious','word bank','Official answer.','答案文件指定。'),Q('Blank (4)','end','word bank','Official answer.','答案文件指定。'),Q('Blank (5)','haunted','word bank','Official answer.','答案文件指定。'),Q('Blank (6)','supply','word bank','Official answer.','答案文件指定。')],'Word bank: bad · end · auspicious · supply · haunted · Malaysian']);S.push(['G','Fill in the blanks with simple future tense (will) or the future continuous tense of the verb in brackets.',[Q('Our table tennis team has been practising hard. I think we ( )(win) the match.','will win','will + V1','Official answer.','跟答案文件。'),Q("Today is my mother's birthday. We be ( )(have) a small party in the evening.",'will be having','will be + V-ing','Official answer.','跟答案文件。'),Q('I ( ) be ( )(go) to the hospital late today because I have a meeting.','will be going','will be + V-ing','Official answer.','跟答案文件。'),Q('My class ( ) be ( )(participate) in the volleyball match next week.','will be participating','will be + V-ing','Official answer.','跟答案文件。'),Q("The shops ( )(close) early on Thursday because it is New Year's Eve.",'will close','will + V1','Official answer.','跟答案文件。'),Q('We won the game. My class ( ) be( ) (organise) a trip to Pangkor Island next week.','will be organising','will be + V-ing','Official answer.','跟答案文件。')]]);const email=`To: nrShaun@gmail.com\nFrom: jrSuraya@gmail.com\nDear Shaun,\n\nHow are you? I hope you are in the pink of health. As we grow older I noticed each community has their own beliefs and superstitions. I am surprised looking at each one's belief.\n\nIn Malaysia, we are not allowed to sit on books. They believe that sitting on books makes us stupid and books are for reading, not for sitting. But my mum told me that she is not sure how this superstition started. Perhaps our elders wanted us to show some respect for our books and care for them.\n\nThen, there is another strange superstition. We must not return an empty dish. If someone gives us some food in a dish, after washing we must put some food in it when we return it to them. Usually foods like sweets or chocolates are placed in it. Indeed, they believe it as a sign of goodwill.\n\nSimilarly, most Malaysians don't sweep the floor at night. Sweeping the floor at night is considered to be bad luck. It is believed that good luck is being ‘swept away’, especially when we sweep things out of the house.\n\nI was really annoyed but at the same time these beliefs have been passed down for generations. In sum, people only follow the beliefs and superstitions but no one really knows why.\n\nHow about in your country? Are there any superstitions? Please share if there is any. Hope you are enjoying your summer break!\nBye for now,\nSuraya`;S.push(['H','Write an email to your friend telling him/her about the superstitions in your country.',[],email]);S.push(['I','Write the past continuous tense or present continuous tense of the verb in brackets.',[Q("I ( ) (do) my homework so don't disturb me. I need to hand in my work tomorrow.",'am doing','continuous tense','Official answer.','跟答案文件。'),Q('He ( )(weed) the flower bed when he saw a strange insect on one of the flowers of the lucky bamboo plant.','was weeding','continuous tense','Official answer.','跟答案文件。'),Q('It ( ) (rain) heavily when we arrived at the Festive Bazaar.','was raining','continuous tense','Official answer.','跟答案文件。'),Q('The pupils ( )(do) their checkpoint when the fire alarm sounded.','were doing','continuous tense','Official answer.','跟答案文件。'),Q('The two reporters ( ) (try) to get more news about the robbery.','are trying','continuous tense','Official answer.','跟答案文件。'),Q('I ( ) (have) my bath when the fire broke out.','was having','continuous tense','Official answer.','跟答案文件。')]]);S.push(['J','Choose the correct pronoun.',[Q('The boy that/who won the first prize in the match is my friend, John.','who','pronoun','Official answer.','跟答案文件。'),Q('Whose/Which ring is this? Will the owner step forward please.','Whose','pronoun','Official answer.','跟答案文件。'),Q('Are that/those your belongings?','those','pronoun','Official answer.','跟答案文件。'),Q('The trainer who/whom you spoke to is my football coach.','whom','pronoun','Official answer.','跟答案文件。'),Q('What/Which colour should I wear? Blue or black?','Which','pronoun','Official answer.','跟答案文件。'),Q("Mum, did your/you take my purse when you were tidying the room? I couldn't find it.",'you','pronoun','Official answer.','跟答案文件。')]]);const esc=s=>String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));document.getElementById('nav').innerHTML=S.map(x=>`<a href="#s${x[0]}">${x[0]}</a>`).join('');document.getElementById('app').innerHTML=S.map(([id,ins,qs,note])=>`<section class="s" id="s${id}"><h2>${id}</h2><div class="inst">${ins}</div>${note?(id==='H'?`<div class="a"><b>Official sample answer / 官方参考答案</b></div><div class="sample">${esc(note)}</div><div class="n">Accept any suitable answers.</div>`:`<div class="n">${note}</div>`):''}${qs.map((q,i)=>`<div class="q"><b>${i+1}. ${q.p}</b><div class="a"><b>Answer / 答案：</b> ${q.a}</div><div class="k"><b>Key / 关键：</b> ${q.k}</div><div class="y">${q.e}<br><span class="cn">${q.c}</span></div></div>`).join('')}</section>`).join('');</script><script src="assets/portal.js"></script></body></html>
