<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet"><title>Form 2 English VS — Cambridge Textbook Unit 4</title><style>*{box-sizing:border-box;-webkit-user-select:none;user-select:none}body{margin:0;background:#f5f8fc;font-family:Arial,'Microsoft YaHei',sans-serif;color:#17202a;line-height:1.65}.w{max-width:1100px;margin:auto}.hero{background:#17324d;color:#fff;padding:34px 20px}h1{margin:0}.nav{position:sticky;top:0;background:#fff;border-bottom:1px solid #dbe3ec;z-index:9;padding:9px}.nav a{display:inline-block;padding:6px 10px;margin:3px;background:#eef4ff;border-radius:8px;color:#17324d;text-decoration:none;font-weight:700}main{padding:16px}.s,.q{background:#fff;border:1px solid #dbe3ec;border-radius:14px;padding:17px;margin:15px 0}.s h2{color:#17324d;border-bottom:2px solid #e7edf5;padding-bottom:7px}.inst{font-weight:700;color:#285b8f}.a,.k,.y,.n,.src{padding:8px 10px;margin-top:7px;border-radius:8px}.a{background:#ecfdf3;border-left:5px solid #22c55e}.k{background:#eff6ff;border-left:5px solid #3b82f6}.y{background:#f8fafc;border:1px solid #e5e7eb}.n{background:#fff7ed;border-left:5px solid #f59e0b}.src{background:#f8fafc;border:1px solid #dbe3ec}.cn{color:#475467}.sample{white-space:pre-wrap;background:#f8fafc;border:1px solid #dbe3ec;padding:13px;border-radius:9px}@media print{.nav{display:none}body{background:#fff}}</style></head><body oncontextmenu="return false"><div class="hero"><div class="w"><h1>Form 2 English VS — Cambridge Textbook Unit 4</h1><div>Teacher’s Reference Version ｜ 老师参考版</div></div></div><div class="nav"><div class="w" id="nav"></div></div><main class="w"><div class="n">原题与答案依据上传的 Cambridge Textbook 与 Answer 文件；主观题保留答案文件提供的参考答案。</div><div id="app"></div></main><script>const S=[];const Q=(p,a,k,e,c)=>({p,a,k,e,c});S.push(['A','Complete the sentences with should or shouldn’t.',[Q('You _______________ spend too much time on electronic gadgets.',"shouldn't",'health advice','Official answer.','跟答案文件。'),Q('We _______________ wash our hair at least four times a week.','should','health advice','Official answer.','跟答案文件。'),Q('We ________________ eat less fast food.','should','health advice','Official answer.','跟答案文件。'),Q('You ________________ get at least 6 to 8 hours of sleep a day.','should','health advice','Official answer.','跟答案文件。'),Q('We _________________ be afraid to report bullies.',"shouldn't",'health advice','Official answer.','跟答案文件。'),Q('You _________________ drink at least 8 glasses of water daily.','should','health advice','Official answer.','跟答案文件。')]]);S.push(['B','Complete the list with the phrases below.',[],`1. We should:\n• Have a healthy breakfast\n• Have light food after 5 pm\n• Exercise regularly\n• Eat lots of fruit and vegetables to stay healthy\n• Have enough sleep\n\n2. We shouldn't:\n• Skip our meals\n• Eat too much junk food\n• Exercise once in a blue moon\n• Sleep immediately after a meal\n• Spend so long on the computer`]);S.push(['C','Make sentences using “must” or “mustn’t”.',[Q('we/ wash/ our hands/before meals','We must wash our hands before meals.','must','Official answer sentence.','跟答案文件。'),Q('they/wash the toilets/daily/to avoid bad odour','They must wash the toilets daily to avoid bad odour.','must','Official answer sentence.','跟答案文件。'),Q('children/eat/too much fast food',"Children mustn't eat too much fast food.",'mustn’t','Official answer sentence.','跟答案文件。'),Q('students/do last minute preparations/for exams',"Students mustn't do last minute preparations for exams.",'mustn’t','Official answer sentence.','跟答案文件。'),Q('children/play/ in the rain',"Children mustn't play in the rain.",'mustn’t','Official answer sentence.','跟答案文件。'),Q('we/wash our shoes/regularly','We must wash our shoes regularly.','must','Official answer sentence.','跟答案文件。')]]);S.push(['D','Read the passage. Then, answer the questions. (KBAT)',[Q('What is a good title for this passage？','Negative Effects of using Electronic Devices.','main idea','The passage discusses harmful effects of excessive device use.','全文主题是电子设备过度使用的负面影响。'),Q('Suggest three physical activities (not from the passage, give your own answer) that teenagers can be involved in to prevent harmful effects that devices cause. (KBAT)','yoga · cycling · gym','official sample answers','These are the samples supplied by the answer file.','答案文件提供这三个参考答案。'),Q('Frequent use of electronic devices will disturb the normal functioning of the brain. True/False','True','stated in passage','The statement is stated directly.','原文直接写出。'),Q('Teenagers who start isolating, have lost interest in interacting with people, have problems sleeping or start to do badly in school are probably suffering from __________________.','depression','mental problems paragraph','The passage links these signs to depression.','原文把这些表现与 depression 联系起来。'),Q('Students get answers from search engines, as a result their ________________________________________________________.','ability to find answers, being creative or imaginative is destroyed.','Consequently...','Official answer reproduces the stated consequence.','答案直接来自原文结果句。'),Q('Excessive use of devices can make a person become ________________.','retarded','It can make us retarded.','Word taken directly from the source and answer file.','此词严格来自原文和答案文件。')]]);S.push(['E','Fill in the blanks with the suitable answer.',[Q('Tobacco smoke ____________ a lot of harmful substances.','contains','official grammar answer','Official answer.','跟答案文件。'),Q('The children _______________ playing in the rain yesterday so they ___________ a cold.','were, caught','official grammar answer','Official answer.','跟答案文件。'),Q('I _______________ attend a talk on “How to handle Stress”.','am going to','official grammar answer','Official answer.','跟答案文件。'),Q('The little girl _____________ and _____________ in the rain.','slipped, fell','official grammar answer','Official answer.','跟答案文件。'),Q('I ___________ finished all the medicine that doctor gave me.','have','official grammar answer','Official answer.','跟答案文件。'),Q('I _____________ great after exercising regularly.','am feeling','official grammar answer','Official answer.','跟答案文件。')]]);S.push(['F','Write the meanings for the following words. You can refer to a dictionary to help you.',[Q('Relieve stress','To be free from a burden.','official definition','Definition from answer file.','定义来自答案文件。'),Q('Dehydration','Occurs when there is an excessive loss of body water.','official definition','Definition from answer file.','定义来自答案文件。'),Q('Bully','A person who uses strength or influence to harm or intimidate those who are weaker.','official definition','Definition from answer file.','定义来自答案文件。'),Q('Vegetarian','A person who does not eat meat or fish and lives on a diet of grains, nuts, seeds, vegetables, fruits and some other non-animal based foods.','official definition','Definition from answer file.','定义来自答案文件。'),Q('Exercise','Engage in physical activity to sustain or improve health and fitness.','official definition','Definition from answer file.','定义来自答案文件。'),Q('Healthy','In a good physical or mental condition.','official definition','Definition from answer file.','定义来自答案文件。')]]);S.push(['G','Choose the correct question tag.',[Q('We’re going for the talk on Mental Health, (aren’t/ are) we?',"aren't",'question tag','Official answer.','跟答案文件。'),Q('You both are sure of going, (aren’t you/ aren’t we)?',"aren't you",'question tag','Official answer.','跟答案文件。'),Q('You have signed up, (have/haven’t) you?',"haven't",'question tag','Official answer.','跟答案文件。'),Q("It's an essential topic, (isn’t / wasn’t) it?","isn't",'question tag','Official answer.','跟答案文件。'),Q('We hope you can come along, (don’t we/ don’t I), Noelani?',"don't we",'question tag','Official answer.','跟答案文件。'),Q('Alyson your parents will come tonight, (will / won’t) they?',"won't",'question tag','Official answer.','跟答案文件。')]]);const advert=`REDEEM A LIMITED EDITION FOLDABLE BAG AT COLD STORAGE!\nSpend a minimum of RM70 on Healthy Food (fresh fruits and vegetables) at Cold Storage to redeem a free & limited edition foldable bag, while stock lasts. Customers will get 10% discount for each purchase of healthy food items after their first purchase.`;S.push(['H','Read the advert below and answer the questions. (KBAT)',[Q('Where can they redeem a free foldable bag','At Cold Storage.','advert heading','Location is stated directly.','地点直接写出。'),Q('Customers will get a 10% discount for purchasing at Cold Storage. True /False','False','healthy food condition','The advert limits the discount to healthy-food purchases after the first purchase.','广告限定 healthy food purchases。'),Q('What is considered to be Healthy Food?','Fresh fruits and vegetables','definition in advert','Healthy Food is defined in brackets.','广告括号直接定义。'),Q('Which customer is eligible to get the free foldable bag and a 10% discount for the next purchase at Cold Storage?','C. Customer C: Vegetables and fruits.','healthy food only','This matches the listed healthy food.','符合广告列出的健康食品。'),Q('What is the minimum amount a person needs to spend to be eligible to redeem a foldable bag and get a 10% discount for the next purchase?','RM 70.','minimum of RM70','Minimum amount is stated directly.','最低消费额直接写出。'),Q('In your opinion, why can shoppers only redeem a foldable bag and get a 10% discount if they buy a list full of vegetables and fresh fruits only, but not any other items? (KBAT)','I think this is to encourage shoppers to eat more vegetables and fresh fruits to stay healthy.','official sample answer','Sample supplied by the answer file.','答案文件提供的 KBAT 参考答案。')],advert]);S.push(['I','Choose the correct answer and complete the sentences below. — How to wash your hands!',[Q('Wet hands with __________________.','water','word bank','Official answer.','跟答案文件。'),Q('Then, apply __________ to cover all hand surfaces.','soap','word bank','Official answer.','跟答案文件。'),Q('Rub ___________ palm to palm.','hands','word bank','Official answer.','跟答案文件。'),Q('Next, rub your ____________ palm over, the back of your left hand, interlacing fingers, and vice versa.','right','word bank','Official answer.','跟答案文件。'),Q('Rub hand palm to palm with _______________ fingers.','interlaced','word bank','Official answer.','跟答案文件。'),Q('Rub the backs of your fingers against the opposite palm so that your hands are _________________.','interlocked','word bank','Official answer.','跟答案文件。'),Q('Rub your right hand _______________ against your left palm and vice versa.','finger tips','word bank','Official answer.','跟答案文件。'),Q('Rinse your hands ______________.','thoroughly','word bank','Official answer.','跟答案文件。'),Q('Dry your hands with a ______________.','clean towel','word bank','Official answer.','跟答案文件。')],'Word bank: soap · finger tips · clean towel · interlocked · water · thoroughly · hands · interlaced · right']);const essay=`Fruits and vegetables contain essential vitamins, minerals, and fibre that help protect us from chronic diseases. Fruits and vegetables have been shown to help protect against heart disease, gastrointestinal issues, certain types of cancers and more. Therefore, eating more vegetables and fruits are important. Every individual should practise to include vegetables and fruits in their diet.\n\nA healthy diet which includes vegetables and fruits more with exercise and healthy lifestyles gives an individual lasting energy. With that, everything they do and set out to achieve can be done in a better way. There will not be lethargy 24/7 and all work can be done energetically. Therefore, our busy daily routines can be handled in a bolder way with much energy. Then, they have higher water and phytochemical content which will help produce healthy glowing skin. Hence, it will help to firm skin and combat wrinkles.\n\nBesides, eating fruits and vegetables will boost our immune system. People who eat less fruits and vegetables will have a weaker immune system. This leads to an increase in chronic diseases, increase in the virus and bacterial invasion and more. Our immune system protects us from getting chronic diseases. Only when it is strong is it able to do its work. Eating plenty of fruits and vegetables everyday can help reduce the risk of heart disease, high blood pressure and more.\n\nFurthermore, they are low in calories and high in fibre. Fruits and vegetables can help us to control our weight. Most people are obese nowadays. Eating more fruits and vegetables which have fewer calories will help us to control our weight. Indeed, it will keep us fit and slim. Eat five kinds of vegetables and two kinds of fruits every day for good health.\n\nIn a nutshell, fruits and vegetables should be the foundation of a healthy diet. We need to double the amount of fruits and vegetables we eat every day. Vegetables and fruits provide nutrients vital for health and maintenance of the body.`;S.push(['J','Write an essay on The Importance of Eating More fruits and vegetables.',[],essay]);const esc=s=>String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));document.getElementById('nav').innerHTML=S.map(x=>`<a href="#s${x[0]}">${x[0]}</a>`).join('');document.getElementById('app').innerHTML=S.map(([id,ins,qs,note])=>`<section class="s" id="s${id}"><h2>${id}</h2><div class="inst">${ins}</div>${note?(id==='J'||id==='B'?`<div class="a"><b>Official answer / 官方参考答案</b></div><div class="sample">${esc(note)}</div>`:id==='H'?`<div class="src"><b>Advert / 原题资料：</b><br>${esc(note).replace(/\n/g,'<br>')}</div>`:`<div class="n">${esc(note)}</div>`):''}${qs.map((q,i)=>`<div class="q"><b>${i+1}. ${q.p}</b><div class="a"><b>Answer / 答案：</b> ${q.a}</div><div class="k"><b>Key / 关键：</b> ${q.k}</div><div class="y">${q.e}<br><span class="cn">${q.c}</span></div></div>`).join('')}</section>`).join('');</script><script src="assets/portal.js"></script></body></html>
